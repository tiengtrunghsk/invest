name: Clean Database Garbage

on:
  # Cho phép bấm nút chạy thủ công từ giao diện Github
  workflow_dispatch: 

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymongo

    - name: Run Cleanup Script
      env:
        # Lấy MONGO_URI từ GitHub Secrets
        MONGO_URI: ${{ secrets.MONGO_URI }}
      run: python clean_db.py
